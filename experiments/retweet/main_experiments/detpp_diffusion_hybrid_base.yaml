# Базовый гибрид Diffusion + DeTPP: per-slot декодер с входом [z_k; q_k],
# diffusion в латентном пространстве + DeTPP matching loss.
# Self-contained config (Hydra defaults chain resolved).
# Generated from canonical/a6_query_only_decoder_v3_paper_detection.yaml

seed_everything: 42
num_evaluation_seeds: 5
max_predictions: 32
num_classes: 3
max_time_delta: 100
max_duration: 100
time_smoothing: 1
history_density_horizons:
- 10
- 20
- 45
- 90
- 180
rnn_hidden_size: 64
rnn_inference_context: 264
rnn_inference_context_step: 50
transformer_context: 128
transformer_hidden_size: 32
transformer_heads: 4
transformer_layers: 2
transformer_positions: 132
transformer_pos_m: 1
transformer_pos_M: 2500
max_intensity: null
ode_lipschitz: 0.1
thinning_params:
  max_steps: 100
  max_delta: ${max_time_delta}
  bound_samples: 100
next_k: 16
hypro_loss_step: 8
logger:
  _target_: pytorch_lightning.loggers.MLFlowLogger
  experiment_name: hotpp-retweet-main
  run_name: ${name}
  tracking_uri: sqlite:///lightning_logs/main_mlflow.db
  artifact_location: file:S:/jupyter/ucheba/detpp/hotpp-benchmark/lightning_logs/canonical_retweet_mlruns
  save_dir: lightning_logs
model_path: main_experiments/checkpoints/${name}.ckpt
report: main_experiments/results/${name}.yaml
multiseed_report: main_experiments/results/multiseed_${name}.yaml
data_module:
  _target_: hotpp.data.HotppDataModule
  batch_size: 64
  min_length: 100
  max_length: 100
  num_workers: 4
  train_path: data/train.parquet
  val_path: data/val.parquet
  test_path: data/test.parquet
metric:
  _target_: hotpp.metrics.HorizonMetric
  max_time_delta: ${max_time_delta}
  horizon: 180
  horizon_evaluation_step: 8
  map_deltas:
  - 30
  map_target_length: 32
  otd_steps: 10
  otd_insert_cost: 15
  otd_delete_cost: 15
head:
  _target_: hotpp.nn.Head
  _partial_: true
  hidden_dims:
  - 64
  use_batch_norm: true
conditional_head:
  _target_: hotpp.nn.ConditionalHead
  _partial_: true
  hidden_dims:
  - 128
  - 256
  use_batch_norm: true
module:
  seq_encoder:
    _target_: hotpp.nn.RnnEncoder
    embedder:
      _target_: hotpp.nn.Embedder
      embeddings:
        labels:
          in: ${num_classes}
          out: 16
      numeric_values:
        timestamps: identity
      categorical_noise: 0.6
    max_time_delta: ${max_time_delta}
    rnn_partial:
      _target_: hotpp.nn.GRU
      _partial_: true
      hidden_size: ${rnn_hidden_size}
    max_inference_context: ${rnn_inference_context}
    inference_context_step: ${rnn_inference_context_step}
  optimizer_partial:
    _partial_: true
    _target_: torch.optim.Adam
    lr: 0.001
    weight_decay: 0.0
  lr_scheduler_partial:
    _partial_: true
    _target_: torch.optim.lr_scheduler.StepLR
    step_size: 5
    gamma: 0.8
  val_metric: ${metric}
  test_metric: ${metric}
  _target_: hotpp.modules.NextKModule
  head_partial: ${head}
  loss:
    _target_: hotpp.losses.HorizonDiffusionLossDetppQueryOnlyDecoder
    k: ${detection_k}
    horizon: ${metric.horizon}
    diffusion_loss_weight: 6.0
    decoder_loss_weight: 1.8
    embedder_regularizer: 2.2
    alpha: 0.14
    detach_embeddings_from_step: false
    detach_decoder: false
    use_detection_calibration_threshold: true
    presence_threshold_bias: 0
    presence_selection: calibrated
    topk_target_length: null
    min_presence_count: null
    query_size: 64
    query_hidden_dims:
    - 128
    - 256
    query_use_batch_norm: true
    query_init_scale: 0.02
    next_item_loss:
      _target_: hotpp.losses.DetectionLoss
      k: ${detection_k}
      horizon: ${metric.horizon}
      loss_subset: 0.33
      prefetch_factor: 0.5
      match_weights:
        _presence: 4
        timestamps: 0.15
        labels: 0.6
      next_item_adapter:
        timestamps: mode
        labels: mean
      next_item_loss_weight: 0
      next_item_loss:
        _target_: hotpp.losses.NextItemLoss
        losses:
          _presence:
            _target_: hotpp.losses.BinaryCrossEntropyLoss
          timestamps:
            _target_: hotpp.losses.TimeMAELoss
            delta: start
            max_delta: ${max_duration}
            smoothing: ${time_smoothing}
          labels:
            _target_: hotpp.losses.CrossEntropyLoss
            num_classes: ${num_classes}
    embedder: ${module.seq_encoder.embedder}
    denoiser_partial:
      _target_: hotpp.nn.GRUDenoiser
      _partial_: true
      hidden_size: ${rnn_hidden_size}
      generation_steps: ${diffusion_steps}
      num_layers: 3
    decoder_partial:
      _target_: hotpp.nn.Head
      _partial_: true
      hidden_dims: []
    max_time_delta: ${max_time_delta}
    loss_step: 1
    generation_steps: ${diffusion_steps}
  max_predictions: ${detection_k}
trainer:
  accelerator: cuda
  devices: 1
  max_epochs: 30
  enable_checkpointing: true
  deterministic: true
  precision: 16-mixed
  gradient_clip_val: 1
  check_val_every_n_epoch: 3
  model_selection:
    metric: val/T-mAP
    mode: max
name: detpp_diffusion_hybrid_base
diffusion_steps: 5
detection_k: 64
